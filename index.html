
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="robots"
          content="noindex, nofollow, noarchive">

    <meta name="theme-color" content="#f7efe7">

    <title>My Story Hub · 如我所书</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body data-theme="paper">

    <!-- 网站环境背景 -->
    <div id="world-background"
         class="world-background"
         aria-hidden="true"></div>

    <div class="ambient-overlay"
         aria-hidden="true"></div>

    <!-- 登录界面 -->
    <section id="login-screen" class="login-screen">

        <div class="login-card">

            <div class="ornament">✧</div>

            <p class="eyebrow">
                PRIVATE LIBRARY · SINCE 2026
            </p>

            <h1 class="brand-title">
                Story Hub
            </h1>

            <p class="brand-subtitle">
                私人创作与阅读空间
            </p>

            <div class="gold-divider"></div>

            <p class="login-quote">
                让故事，以另一种方式延续。
            </p>

            <form id="login-form">

                <label for="login-email">
                    邮箱
                </label>

                <input id="login-email"
                       type="email"
                       autocomplete="username"
                       placeholder="请输入邮箱"
                       required>

                <label for="login-password">
                    密码
                </label>

                <input id="login-password"
                       type="password"
                       autocomplete="current-password"
                       placeholder="请输入密码"
                       required>

                <button id="login-button"
                        type="submit"
                        class="primary-button">
                    进入藏书馆
                </button>

                <p id="login-message"
                   role="status"
                   aria-live="polite"></p>

            </form>

            <p class="privacy-notice">
                私人藏书馆 · 仅向受邀好友开放
            </p>

        </div>

    </section>

    <!-- 登录后的主网站 -->
    <div id="app" hidden>

        <!-- 网站顶部 -->
        <header id="site-header"
                class="site-header">

            <div class="header-meta">

                <span>VOL. 01</span>

                <span>故事 · 世界 · 阅读</span>

                <span>SINCE 2026</span>

            </div>

            <div class="brand-block">

                <div class="ornament">✧</div>

                <h1 class="brand-title">
                    Story Hub
                </h1>

                <p class="brand-subtitle">
                    私人小说创作与阅读空间
                </p>

            </div>

            <!-- 主导航 -->
            <nav id="main-nav"
                 class="main-nav"
                 aria-label="主导航">

                <button data-view="home">
                    首页
                </button>

                <button data-view="library">
                    馆藏作品
                </button>

                <button data-view="history">
                    阅读记录
                </button>

                <button data-view="studio"
                        data-admin-only
                        hidden>
                    创作管理
                </button>

                <button data-view="insights"
                        data-admin-only
                        hidden>
                    阅读反馈
                </button>

                <button data-view="settings">
                    设置
                </button>

                <button id="logout-button">
                    退出
                </button>

            </nav>

        </header>

        <!-- 首页、目录、创作及阅读内容 -->
        <main id="main-content"
              class="main-content"
              tabindex="-1">

            <div class="loading-state">
                正在展开故事……
            </div>

        </main>

        <!-- 昔涟与如我所书 -->
        <footer id="story-footer"
                class="story-footer">

            <div class="cyrene-art">

                <img id="cyrene-image"
                     alt="昔涟与展开的如我所书"
                     hidden>

            </div>

            <div class="footer-text">

                <p class="footer-quote">
                    让值得铭记的故事，在文字中延续。
                </p>

                <p>
                    STORY HUB · PRIVATE COLLECTION
                </p>

                <small>
                    非官方、非商业性质的私人文学空间
                </small>

            </div>

        </footer>

    </div>

    <!-- 通用弹窗 -->
    <dialog id="app-dialog"
            class="app-dialog">

        <div id="dialog-content"></div>

    </dialog>

    <!-- 操作提示 -->
    <div id="toast"
         class="toast"
         role="status"
         aria-live="polite"
         hidden></div>

    <!-- 网站功能程序 -->
    <script type="module" src="./app.js"></script>

</body>
</html>
